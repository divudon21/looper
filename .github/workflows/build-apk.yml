name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.7.4)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Bug fixes and improvements'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Remove broken plugin for CI build
        run: |
          sed -i '/appambit_sdk_flutter/d' pubspec.yaml
          cat > lib/core/services/appambit_reporter.dart << 'DART'
          import 'package:flutter/widgets.dart';
          class AppAmbitReporter {
            static bool get mustStartBeforeUi => false;
            static List<NavigatorObserver> get navigatorObservers => const [];
            static Future<void> start() async {}
            static Future<void> reportError({required String message, dynamic exception, StackTrace? stackTrace}) async {}
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs (arm64-v8a, armeabi-v7a)
        run: flutter build apk --release --flavor github --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release --flavor github

      - name: Prepare APKs for release
        run: |
          mkdir -p release-apks
          dir=build/app/outputs/flutter-apk
          
          # Copy arm64-v8a APK
          if [ -f "$dir/app-arm64-v8a-github-release.apk" ]; then
            cp "$dir/app-arm64-v8a-github-release.apk" release-apks/looper-arm64-v8a.apk
          elif [ -f "$dir/app-github-arm64-v8a-release.apk" ]; then
            cp "$dir/app-github-arm64-v8a-release.apk" release-apks/looper-arm64-v8a.apk
          fi
          
          # Copy armeabi-v7a APK
          if [ -f "$dir/app-armeabi-v7a-github-release.apk" ]; then
            cp "$dir/app-armeabi-v7a-github-release.apk" release-apks/looper-armeabi-v7a.apk
          elif [ -f "$dir/app-github-armeabi-v7a-release.apk" ]; then
            cp "$dir/app-github-armeabi-v7a-release.apk" release-apks/looper-armeabi-v7a.apk
          fi
          
          # Copy universal APK
          if [ -f "$dir/app-github-release.apk" ]; then
            cp "$dir/app-github-release.apk" release-apks/looper-universal.apk
          fi
          
          echo "=== Built APKs ==="
          ls -lh release-apks/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.version }} \
            release-apks/*.apk \
            --title "Looper Player ${{ github.event.inputs.version }}" \
            --notes "${{ github.event.inputs.release_notes }}"
