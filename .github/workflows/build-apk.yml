name: Build APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      sign_apk:
        description: 'Sign APK with keystore'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --- Signing Setup (only if secrets available and sign_apk is true) ---
      - name: Decode Keystore
        if: ${{ github.event.inputs.sign_apk == 'true' && secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ github.event.inputs.sign_apk == 'true' && secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      # --- Build APK ---
      - name: Build Release APK (Signed)
        if: ${{ github.event.inputs.sign_apk == 'true' && secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release --flavor github --split-per-abi

      - name: Build Release APK (Unsigned)
        if: ${{ github.event.inputs.sign_apk != 'true' || secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --release --flavor github

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug --flavor github

      # --- Collect APKs ---
      - name: Collect APK files
        run: |
          mkdir -p build/apk-output
          # Copy split-per-abi APKs if they exist
          if ls build/app/outputs/flutter-apk/app-*-github-release.apk 1>/dev/null 2>&1 || \
             ls build/app/outputs/flutter-apk/app-github-*-release.apk 1>/dev/null 2>&1; then
            cp build/app/outputs/flutter-apk/app-*-github-release.apk build/apk-output/ 2>/dev/null || true
            cp build/app/outputs/flutter-apk/app-github-*-release.apk build/apk-output/ 2>/dev/null || true
          fi
          # Copy single APK if it exists
          if [ -f build/app/outputs/flutter-apk/app-github-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-github-release.apk build/apk-output/looper-player-release.apk
          fi
          # Copy debug APK if it exists
          if [ -f build/app/outputs/flutter-apk/app-github-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-github-debug.apk build/apk-output/looper-player-debug.apk
          fi
          # If nothing found, try any APK
          if [ -z "$(ls -A build/apk-output/ 2>/dev/null)" ]; then
            find build/app/outputs/ -name "*.apk" -exec cp {} build/apk-output/ \;
          fi
          echo "=== Built APKs ==="
          ls -lh build/apk-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: looper-apk-build
          path: build/apk-output/*.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## 🎵 APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built APKs:" >> $GITHUB_STEP_SUMMARY
          ls -lh build/apk-output/*.apk 2>/dev/null | awk '{print "- `" $9 "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above ⬆️" >> $GITHUB_STEP_SUMMARY
