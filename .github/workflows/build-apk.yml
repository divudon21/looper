name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Remove appambit_sdk_flutter - its native Android code is missing
      # in v1.2.0 (main class not found). This is an optional analytics SDK.
      - name: Remove broken plugin for CI build
        run: |
          sed -i '/appambit_sdk_flutter/d' pubspec.yaml
          # Comment out the import and make the reporter a no-op
          cat > lib/core/services/appambit_reporter.dart << 'DART'
          import 'package:flutter/widgets.dart';
          class AppAmbitReporter {
            static bool get mustStartBeforeUi => false;
            static List<NavigatorObserver> get navigatorObservers => const [];
            static Future<void> start() async {}
            static Future<void> reportError({required String message, dynamic exception, StackTrace? stackTrace}) async {}
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --flavor github

      - name: Collect APK
        run: |
          mkdir -p build/apk-output
          if [ -f build/app/outputs/flutter-apk/app-github-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-github-release.apk build/apk-output/looper-player-release.apk
          else
            find build/app/outputs/ -name "*.apk" -exec cp {} build/apk-output/ \;
          fi
          ls -lh build/apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: looper-apk
          path: build/apk-output/*.apk
          retention-days: 30
