name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --flavor github

      - name: Collect APK
        run: |
          mkdir -p build/apk-output
          if [ -f build/app/outputs/flutter-apk/app-github-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-github-release.apk build/apk-output/looper-player-release.apk
          else
            find build/app/outputs/ -name "*.apk" -exec cp {} build/apk-output/ \;
          fi
          ls -lh build/apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: looper-apk
          path: build/apk-output/*.apk
          retention-days: 30
